name: Bug report
description: A cuwan command did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please write in English. Remove API keys, wallet secrets and other credentials before you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The cuwan command you ran, and its output. An AI agent can paste this for you.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cuwan version
      description: Run `cuwan version`
      placeholder: v0.0.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your computer's OS
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11 with WSL
    validations:
      required: true
  - type: input
    id: exchange
    attributes:
      label: Exchange / market (if it matters)
      description: Spot or futures, paper or live, and the symbol
      placeholder: Binance spot BTCUSDT paper
